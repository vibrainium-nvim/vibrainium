name: vibrainium
description: Umbrella Neovim plugin and CLI binary exposing vivcs, viff, and other tools.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.2.0

executables:
  vibrainium: vibrainium

dependencies:
  nvim:
    path: ../nvim
  visettings:
    path: ../visettings
  vivcs:
    path: ../vivcs
  viworkspace:
    path: ../viworkspace

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
