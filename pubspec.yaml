name: vibrainium
description: Umbrella Neovim plugin and CLI binary exposing viworkspace, vivcs, viproblems, visearch, and other tools.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.2.0

executables:
  vibrainium: vibrainium

dependencies:
  nvim:
    path: ../nvim
  viagent:
    path: ../viagent
  viff:
    path: ../viff
  viproblems:
    path: ../viproblems
  visearch:
    path: ../visearch
  visettings:
    path: ../visettings
  vivcs:
    path: ../vivcs
  viworkspace:
    path: ../viworkspace

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
